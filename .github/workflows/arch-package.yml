name: Linux packages

# Runs on its own when a release tag (v*) is pushed, and by hand (Actions tab,
# or `gh workflow run arch-package.yml`). Builds the meter's Linux packages and
# keeps them as downloads:
#
# - the Arch package (packaging/arch/PKGBUILD, makepkg in an Arch container),
#   for Arch, CachyOS, Manjaro, EndeavourOS;
# - the .deb (Debian, Ubuntu, Mint, Pop!_OS) and .rpm (Fedora, openSUSE),
#   built by Tauri on Ubuntu 22.04 so they run on that and anything newer,
#   then installed on clean Ubuntu, Debian and Fedora to prove they work.
#
# Every package's install script grants packet-capture permission, so the
# meter never runs as root. Nothing here publishes anything: the files go to
# the CDN by hand.
#
# For a release, pushing the tag starts it (by hand: `gh workflow run
# arch-package.yml -f ref=v2.0.36`): the packages are then plain 2.0.36, and go to the CDN with
# the MSI before the manifest names them (archUrl, debUrl, rpmUrl), which is
# what Linux meters update from.
on:
  # A pushed tag is checked out as itself (inputs.ref is empty then).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (a release tag for a release)"
        required: false
        default: main

# Builds and tests only: nothing here writes to the repository (security
# audit M13). Uploaded artifacts need no extra permission.
permissions:
  contents: read

jobs:
  # Packs the binaries the .deb job built instead of compiling them again
  # (that took 3.5 of its 4.5 minutes). They are built on Ubuntu 22.04, whose
  # older glibc runs on Arch, and libpcap is loaded at run time under either
  # name (platform/linux/pcap.rs); the .rpm ships the same binary to Fedora.
  # A2T_PREBUILT=1 makes the PKGBUILD's build() use them; plain `makepkg`
  # from a checkout still builds from source.
  package:
    name: makepkg
    needs: deb-rpm
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # git first, so checkout keeps the history pkgver() reads. The rest are
      # the package's runtime dependencies, so ldd below can resolve them.
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed git \
            webkit2gtk-4.1 gtk3 libpcap libcap hicolor-icon-theme \
            gst-plugins-base gst-plugins-good
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-binaries
          path: src-tauri/target/release
      # It must load on Arch: every library it needs is found.
      - name: What it links against
        run: |
          ldd src-tauri/target/release/a2tools-dps-meter | sort
          ! ldd src-tauri/target/release/a2tools-dps-meter | grep "not found"
      # makepkg refuses to run as root. --nodeps: the makedepends (rust,
      # npm) are not needed to pack prebuilt binaries.
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && A2T_PREBUILT=1 makepkg --noconfirm --nodeps"
          ls -la "$GITHUB_WORKSPACE"/packaging/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  deb-rpm:
    name: .deb and .rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: deb-rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      # Cached between runs (it took a minute to download and install every
      # time); the list is the cache key, so changing it fetches afresh.
      - name: Build dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm cpio mold
          version: 1
      # mold links far faster than ld, and the meter's link is a large share
      # of an incremental build. GCC 11 (Ubuntu 22.04) has no -fuse-ld=mold;
      # -B points it at mold's `ld` instead, as mold's README says.
      - name: Link with mold
        run: |
          test -x /usr/libexec/mold/ld
          echo "RUSTFLAGS=-C link-arg=-B/usr/libexec/mold" >> "$GITHUB_ENV"
      # Files a clean checkout lacks (gitignored mirrors of src/data), as in
      # the PKGBUILD's build().
      - name: Frontend data
        run: |
          mkdir -p public/i18n public/data public/src/data
          cp -r src/data/i18n/* public/i18n/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/data/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/src/data/
      - name: Build
        run: |
          npm ci
          # The hotkeys helper first: tauri.linux.conf.json packs it next to
          # the meter (platform/linux/hotkeys.rs), without capabilities.
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin a2tools-hotkeys
          npx tauri build --bundles deb,rpm
      # The same two binaries for the Arch package (the makepkg job).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-binaries
          path: |
            src-tauri/target/release/a2tools-dps-meter
            src-tauri/target/release/a2tools-hotkeys
          if-no-files-found: error
      # Tauri's .rpm can only grant capture permission from a %post script,
      # which rpm-ostree (Bazzite and the other image-based Fedoras) runs
      # without the privilege to do it. Repackage its files with our spec,
      # which declares the permission in the package (%caps) instead.
      - name: Rebuild the .rpm
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          # rpm allows no "-" in a version: a test build's 2.1.5-hypr1 is
          # 2.1.5~hypr1, which rpm sorts below the release 2.1.5.
          version=${version//-/\~}
          mkdir -p rpmpayload
          (cd rpmpayload && rpm2cpio ../src-tauri/target/release/bundle/rpm/*.rpm | cpio -idm --quiet)
          (
            cd rpmpayload
            find "./usr/lib/A2Tools DPS Meter" -type d | sed 's|^\.||; s|.*|%dir "&"|'
            find . \( -type f -o -type l \) | sed 's|^\.||' | while IFS= read -r f; do
              if [ "$f" = /usr/bin/a2tools-dps-meter ]; then
                printf '%%caps(cap_net_raw=ep) "%s"\n' "$f"
              else
                printf '"%s"\n' "$f"
              fi
            done
          ) > rpm-files.txt
          head -20 rpm-files.txt
          rpmbuild -bb packaging/linux/a2-tools-dps-meter.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "pkgversion $version" \
            --define "payload $PWD/rpmpayload" \
            --define "filelist $PWD/rpm-files.txt"
      # Tauri names the .deb after the product ("A2Tools DPS Meter_2.0.36_amd64.deb");
      # the CDN and the updater use the package name instead.
      - name: Name the packages
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb "out/a2tools-dps-meter_${version}_amd64.deb"
          cp rpmbuild/RPMS/x86_64/*.rpm "out/a2tools-dps-meter-${version}-1.x86_64.rpm"
          ls -la out
      - name: What is in them
        run: |
          dpkg-deb --info out/*.deb
          dpkg-deb --contents out/*.deb | grep -v '/$'
          rpm -qp --requires out/*.rpm
          rpm -qp --scripts out/*.rpm
          rpm -qp --filecaps out/*.rpm | grep cap_net_raw
          rpm -qlp out/*.rpm | grep -E '^/usr/(bin|share/applications)/'
          dpkg-deb --contents out/*.deb | grep -q usr/bin/a2tools-hotkeys
          rpm -qlp out/*.rpm | grep -qx /usr/bin/a2tools-hotkeys
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb-rpm-packages
          path: out/*
          if-no-files-found: error

  install-test:
    name: Install on ${{ matrix.image }}
    needs: deb-rpm
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./a2tools-dps-meter_*_amd64.deb
          - image: debian:12
            install: apt-get update && apt-get install -y ./a2tools-dps-meter_*_amd64.deb
          - image: fedora:41
            install: dnf install -y ./a2tools-dps-meter-*.x86_64.rpm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb-rpm-packages
      # Dependencies resolve, the install script grants capture permission,
      # and every library the meter links against is there.
      - name: Install
        run: ${{ matrix.install }}
      - name: Check
        run: |
          set -e
          test -x /usr/bin/a2tools-dps-meter
          getcap /usr/bin/a2tools-dps-meter | tee /dev/stderr | grep -q cap_net_raw
          # The hotkeys helper: present, and without any capability, which is
          # what lets the desktop portal accept it (#42).
          test -x /usr/bin/a2tools-hotkeys && test -z "$(getcap /usr/bin/a2tools-hotkeys)"
          if ldd /usr/bin/a2tools-dps-meter | grep 'not found'; then exit 1; fi
          # Under one of the names platform/linux/pcap.rs loads it by.
          ldconfig -p | grep -qE 'libpcap\.so\.(1|0\.8) ' || { echo "libpcap missing"; exit 1; }
          ls /usr/share/applications/ | grep -i a2tools

  # The RPM repository on the CDN (linux/rpm/), which Fedora and the
  # image-based Fedoras install and update the meter from. Its package and
  # its index (repomd.xml) are signed with the Linux packages key (secret
  # LINUX_SIGNING_KEY; the public half is packaging/linux/a2tools.asc, served
  # as linux/a2tools.asc) and a2tools.repo has dnf check both: otherwise a
  # package swapped on the CDN would install as root (audit M4). The signed
  # .rpm here is the one to publish, at every address.
  rpm-repo:
    name: RPM repository
    needs: deb-rpm
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: packaging/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb-rpm-packages
          path: built
      - name: Sign and index
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINUX_SIGNING_KEY" || { echo "LINUX_SIGNING_KEY is not set: the repository can't be signed"; exit 1; }
          dnf install -y createrepo_c rpm-sign gnupg2
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$LINUX_SIGNING_KEY" | gpg --batch --import
          # The key that signs is the one the repo file names.
          fpr=$(gpg --batch --with-colons --show-keys packaging/linux/a2tools.asc | awk -F: '/^fpr/ {print $10; exit}')
          gpg --batch --list-secret-keys "$fpr" > /dev/null
          mkdir -p repo/rpm
          cp built/a2tools-dps-meter-*.x86_64.rpm repo/rpm/
          rpmsign --define "_gpg_name $fpr" --define "__gpg $(command -v gpg)" --addsign repo/rpm/*.rpm
          rpm --import packaging/linux/a2tools.asc
          rpm -K repo/rpm/*.rpm | tee /dev/stderr | grep -q 'signatures OK'
          createrepo_c repo/rpm
          gpg --batch --yes --local-user "$fpr" --armor --detach-sign repo/rpm/repodata/repomd.xml
          cp packaging/linux/a2tools.asc repo/
          ls -laR repo
      # Installed from the repository, the way a player does, rather than
      # from the file, with both signatures checked.
      - name: Install from it
        run: |
          printf '[a2tools]\nname=A2Tools DPS Meter (test)\nbaseurl=file://%s/repo/rpm/\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file://%s/repo/a2tools.asc\n' "$PWD" "$PWD" \
            > /etc/yum.repos.d/a2tools.repo
          dnf install -y a2-tools-dps-meter
          getcap /usr/bin/a2tools-dps-meter | grep cap_net_raw
          test -x /usr/bin/a2tools-hotkeys && test -z "$(getcap /usr/bin/a2tools-hotkeys)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rpm-repo
          path: repo
          if-no-files-found: error

  # Bazzite publishes its system as a container image. Installing into it is
  # not a reboot into a layered deployment, but it is Bazzite's own rpm-ostree
  # and libraries, and shows whether the capture permission arrives without
  # any install script.
  bazzite:
    name: Install on Bazzite
    needs: rpm-repo
    runs-on: ubuntu-24.04
    steps:
      # The image is large; the runner needs the room. The runner's scratch
      # disk (/mnt) usually has plenty, so the image goes there; deleting
      # preinstalled toolchains from / (over a minute) is the fallback.
      - name: Disk space
        run: |
          avail=$(df --output=avail -k /mnt 2>/dev/null | tail -1 | tr -d " ")
          if [ "${avail:-0}" -gt 31457280 ]; then
            sudo mkdir -p /mnt/containers
            echo "PODMAN_ROOT=--root=/mnt/containers" >> "$GITHUB_ENV"
            df -h /mnt
          else
            for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
              sudo rm -rf "$d" &
            done
            wait
            df -h /
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rpm-repo
          path: repo
      - name: Install
        run: |
          # Podman, not Docker: the image has more layers than Docker allows
          # ("max depth exceeded").
          sudo podman $PODMAN_ROOT run --rm -v "$PWD/repo:/repo:ro" ghcr.io/ublue-os/bazzite:stable bash -euc '
            cat /etc/os-release | grep -E "^(NAME|VERSION)="
            printf "[a2tools]\nname=A2Tools DPS Meter (test)\nbaseurl=file:///repo/rpm/\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file:///repo/a2tools.asc\n" > /etc/yum.repos.d/a2tools.repo
            if rpm-ostree install a2-tools-dps-meter; then
              echo "installed with rpm-ostree"
            else
              echo "rpm-ostree could not install here; trying dnf"
              dnf install -y a2-tools-dps-meter
            fi
            getcap /usr/bin/a2tools-dps-meter | tee /dev/stderr | grep -q cap_net_raw
            test -x /usr/bin/a2tools-hotkeys && test -z "$(getcap /usr/bin/a2tools-hotkeys)"
            if ldd /usr/bin/a2tools-dps-meter | grep "not found"; then exit 1; fi
            ldconfig -p | grep -qE "libpcap\.so\.(1|0\.8) "
          '

  # SteamOS (Steam Deck) replaces its read-only system on every update, so the
  # meter goes in a distrobox, which SteamOS ships: Arch inside, our Arch
  # package installed normally. The box must be rootful (--root); a rootless
  # one cannot capture the host's network. This runs that route on Ubuntu
  # (no SteamOS image exists to test in) and checks what it depends on.
  steamos-distrobox:
    name: SteamOS route (rootful distrobox)
    needs: package
    # Required, like the other install tests: a failure here fails the run.
    # It used to be allowed to fail, while distrobox could not create a rootful
    # box without its interactive password prompt (the skip flag was misread
    # as a box name: a literal "\n" where a line continuation belonged, fixed
    # in 2.0.56). A real Steam Deck is still unconfirmed (docs/linux.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: arch-package
          path: pkg
      - name: Create the box and install
        run: |
          # Ubuntu's distrobox (1.7) is older than SteamOS's; use a current one.
          # The runner image ships podman; install it only if that changes.
          command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
          curl -fsS https://raw.githubusercontent.com/89luca89/distrobox/1.8.2.5/install | sh -s -- --prefix ~/.local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          distrobox version
          # A rootful box asks for a password for the user inside it on first
          # entry; a player types one, CI cannot.
          distrobox create --root --yes --name a2tools --image docker.io/library/archlinux:latest \
            --absolutely-disable-root-password-i-am-really-positively-sure
          distrobox enter --root a2tools -- sudo pacman -Syu --noconfirm
          distrobox enter --root a2tools -- sudo pacman -U --noconfirm "$PWD"/pkg/*.pkg.tar.zst
      - name: Capture permission
        run: distrobox enter --root a2tools -- getcap /usr/bin/a2tools-dps-meter | grep cap_net_raw
      # The meter finds the game by its process on the host.
      - name: Sees host processes
        run: |
          sleep 600 &
          distrobox enter --root a2tools -- sh -c "test -d /proc/$!"
      # A program with the same file capability captures the host's traffic
      # as the normal user, which is what the meter does with libpcap.
      - name: Captures host traffic
        run: |
          distrobox enter --root a2tools -- sudo pacman -S --noconfirm tcpdump
          distrobox enter --root a2tools -- sudo setcap cap_net_raw=ep /usr/bin/tcpdump
          ( sleep 3; for i in 1 2 3 4 5; do curl -s -o /dev/null https://cdn.a2tools.app/latest-v2.json; sleep 1; done ) &
          distrobox enter --root a2tools -- timeout 20 tcpdump -i any -c 5 -n 'tcp port 443'
